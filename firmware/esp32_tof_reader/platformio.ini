; PlatformIO (суулгац хөрвүүлэх хэрэгсэл)-д зориулсан хавтан, мэдрэгчийн сонголт.
[platformio]
src_dir = .
default_envs = devkit_l1

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 921600

[env:devkit_l1]
board = esp32dev
lib_deps = pololu/VL53L1X@1.3.1

[env:devkit_l5]
board = esp32dev
build_flags = -DUSE_VL53L5CX=1
lib_deps = sparkfun/SparkFun VL53L5CX Arduino Library@1.0.3

[env:c3_l1]
extends = env:devkit_l1
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3_l5]
extends = env:devkit_l5
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_VL53L5CX=1
